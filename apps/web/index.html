<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9F8F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131211" />
    <meta
      name="description"
      content="LXP Toolkit — seu copiloto de estudos: tarefas do UniFOA em um só lugar, rascunhos com IA e envio ao portal."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="LXP Toolkit" />
    <meta name="apple-mobile-web-app-title" content="LXP Toolkit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LXP Toolkit · copiloto de estudos</title>
    <script>
      // No-flash theme init: resolves light/dark before first paint.
      // NOTE: "pauta-theme" is a legacy storage key, kept so existing users keep their theme.
      (function () {
        try {
          var t = localStorage.getItem("pauta-theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
