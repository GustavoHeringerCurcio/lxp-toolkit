# Local stack: Postgres + the full LXP Toolkit app.
#
#   docker compose up -d --build   # UI + API on http://localhost:4174
#   docker compose logs -f app
#   docker compose down
#
# Reuses your existing ./scraped data and ./apps/server/data cache (bind mounts)
# and the Postgres volume, so switching from `npm run dev` loses nothing.
services:
  db:
    image: postgres:16-alpine
    container_name: lxp-toolkit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lxp
      POSTGRES_PASSWORD: lxp
      POSTGRES_DB: lxp
    ports:
      # Host port for psql/pg_dump/migrations; override with LXP_DB_PORT.
      - "127.0.0.1:${LXP_DB_PORT:-5434}:5432"
    volumes:
      - lxp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lxp -d lxp"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lxp

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lxp-toolkit-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Credentials are read from the gitignored host files at runtime. Do NOT
    # bind-mount them into the container: apps/server/src/paths.ts loads
    # apps/server/.env with `override: true` and would clobber the values below.
    env_file:
      - apps/server/.env
      - packages/portal/.env
    environment:
      DATABASE_URL: postgres://lxp:lxp@db:5432/lxp
      DATA_DIR: /data/scraped
      OUT_DIR: /data/scraped
      PORT: "4174"
      # Chromium cannot use its sandbox inside a normal Docker container.
      PLAYWRIGHT_NO_SANDBOX: "true"
    volumes:
      - ./scraped:/data/scraped
      - ./apps/server/data:/app/apps/server/data
    ports:
      # Loopback only; the API is unauthenticated in local mode.
      - "127.0.0.1:4174:4174"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Bootstrap runs migrations + imports + text extraction before listening.
      start_period: 300s
    stop_grace_period: 20s
    networks:
      - lxp

networks:
  lxp:
    driver: bridge
    # Docker Desktop's NAT breaks path-MTU discovery. The host path here is
    # ~1448 bytes, so the default 1500 MTU drops large TLS 1.3 ClientHellos
    # (Node/undici and Chromium), surfacing as "Connection error" against
    # OpenAI. 1280 is the IPv6 minimum and fixes both clients without
    # downgrading TLS.
    driver_opts:
      com.docker.network.driver.mtu: "1280"
    ipam:
      config:
        - subnet: 10.99.0.0/16

volumes:
  lxp_pgdata:
